<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60' width='200' height='60' font-family='Inter, &apos;Helvetica Neue&apos;, Arial, sans-serif' role='graphics-document document' aria-roledescription='diagram' aria-labelledby='title'>
<title id='title'>Mermaid flowchart diagram</title>
<style>
