name: "Elegant Windows current-head observations r34"
on:
  push:
    branches: ["ci/elegant-current-windows-20261127-r34"]
    paths:
      - ".github/workflows/elegant-current-windows-r34.yml"
      - "ci-tools/elegant-current-windows-r34/**"
permissions:
  contents: read
concurrency:
  group: "elegant-current-windows-r34-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  observe:
    runs-on: depot-windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      GOENV: "off"
      GOCACHEPROG: ""
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - name: Checkout the frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "325bc562588b1989cdd137116e937784865ee5ad"
          path: source
          persist-credentials: false
      - name: Checkout this proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - name: Install the frozen Rust toolchain
        working-directory: source
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
          python-version: "3.15"
          enable-cache: false
      - name: Prepare native local and UNC filesystem roots
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "emd-windows-r34-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $local = Join-Path $root "local"
          $network = Join-Path $root "network"
          New-Item -ItemType Directory -Path $local, $network -ErrorAction Stop | Out-Null
          $shareName = "emd-r34-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          Start-Service LanmanServer -ErrorAction Stop
          New-SmbShare -Name $shareName -Path $network -FullAccess $account -ErrorAction Stop | Out-Null
          $unc = "\\localhost\$shareName"
          if (-not (Test-Path -LiteralPath $unc -PathType Container)) { throw "Native UNC share is unavailable" }
          "EMD_TEST_LOCAL_ROOT=$local" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "EMD_TEST_UNC_ROOT=$unc" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          "EMD_TEST_SHARE=$shareName" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          $evidence = Join-Path $env:RUNNER_TEMP "emd-windows-evidence"
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          @{ windows = [Environment]::OSVersion.VersionString; architecture = $env:PROCESSOR_ARCHITECTURE; native_unc_available = $true; run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT } | ConvertTo-Json | Set-Content -Path (Join-Path $evidence "runner.json") -Encoding utf8
      - name: Observe the current renderer against frozen native witnesses
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOENV = "off"
          $env:GOCACHEPROG = ""
          $effective = go env GOCACHEPROG
          if ($LASTEXITCODE -ne 0 -or -not [string]::IsNullOrEmpty($effective)) { throw "External Go cache is active" }
          uv run --no-project --python 3.15 proof/ci-tools/elegant-current-windows-r34/verify.py source proof/ci-tools/elegant-current-windows-r34 "$env:RUNNER_TEMP/emd-windows-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove the disposable native share
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          $shareName = "emd-r34-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Get-SmbShare -Name $shareName -ErrorAction SilentlyContinue) {
            Remove-SmbShare -Name $shareName -Force -ErrorAction Stop
          }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: elegant-current-windows-r34
          path: ${{ runner.temp }}/emd-windows-evidence
          if-no-files-found: error
          retention-days: 7
