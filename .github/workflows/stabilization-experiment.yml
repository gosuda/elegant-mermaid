name: "stabilization experiment"

"on":
  push:
    branches:
      - "wip/stabilization-recovery"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "stabilization-experiment-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

jobs:
  geometry:
    runs-on: "depot-ubuntu-24.04-8"
    timeout-minutes: 60
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Set up Go"
        uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: "Set up pnpm"
        uses: "pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115" # v6.1.1
        with:
          version: "12.18.0"
      - name: "Set up Node"
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "26.13.1"
      - name: "Prepare immutable baseline and probes"
        id: "baseline"
        run: |
          node --check stability-recovery/experiment.mjs
          node stability-recovery/experiment.mjs prepare
          git diff --exit-code 4f18d67db8d2e7434cfbf6eed0627d6bb182923d -- internal crates
          mkdir -p tools/cell-repair-probe
          cp stability-recovery/cell/main.go.txt tools/cell-repair-probe/main.go
          gofmt -w tools/cell-repair-probe/main.go
          go build -o "$RUNNER_TEMP/emd-baseline" ./cmd/emd
          go build -o "$RUNNER_TEMP/cell-baseline" ./tools/cell-repair-probe
      - name: "Inspect baseline cell failures"
        if: "!cancelled() && steps.baseline.outcome == 'success'"
        run: |
          mapfile -t fixtures < recovery-results/cells.txt
          "$RUNNER_TEMP/cell-baseline" "${fixtures[@]}" > recovery-results/cell-baseline.jsonl
          node stability-recovery/cell/summarize.mjs recovery-results/cell-baseline.jsonl
      - name: "Install oracle packages"
        id: "packages"
        if: "!cancelled() && steps.baseline.outcome == 'success'"
        run: "pnpm --dir tools/upstream-oracle install --frozen-lockfile"
      - name: "Generate complete comparison inputs"
        id: "comparisons"
        if: "!cancelled() && steps.packages.outcome == 'success'"
        run: "EMD_BIN=\"$RUNNER_TEMP/emd-baseline\" node tools/upstream-oracle/baseline.mjs recovery-results/fixtures.txt 4"
      - name: "Record baseline scores and geometry"
        id: "baseline_scores"
        if: "!cancelled() && steps.comparisons.outcome == 'success'"
        run: "node stability-recovery/experiment.mjs collect baseline \"$RUNNER_TEMP/emd-baseline\""
      - name: "Apply isolated geometry prototype"
        id: "overlay"
        if: "!cancelled() && steps.baseline.outcome == 'success'"
        run: "node stability-recovery/experiment.mjs apply"
      - name: "Run geometry regressions"
        if: "!cancelled() && steps.overlay.outcome == 'success'"
        run: "go test -count=1 ./internal/layout/layered"
      - name: "Build immutable prototype and probe"
        id: "trial"
        if: "!cancelled() && steps.overlay.outcome == 'success'"
        run: |
          go build -o "$RUNNER_TEMP/emd-trial" ./cmd/emd
          go build -o "$RUNNER_TEMP/cell-trial" ./tools/cell-repair-probe
      - name: "Inspect prototype cell failures"
        if: "!cancelled() && steps.trial.outcome == 'success'"
        run: |
          mapfile -t fixtures < recovery-results/cells.txt
          "$RUNNER_TEMP/cell-trial" "${fixtures[@]}" > recovery-results/cell-trial.jsonl
          node stability-recovery/cell/summarize.mjs recovery-results/cell-trial.jsonl
      - name: "Record prototype scores and geometry"
        id: "trial_scores"
        if: "!cancelled() && steps.trial.outcome == 'success' && steps.comparisons.outcome == 'success'"
        run: "node stability-recovery/experiment.mjs collect trial \"$RUNNER_TEMP/emd-trial\""
      - name: "Audit literal compound layout bounds"
        if: "!cancelled() && steps.baseline_scores.outcome == 'success' && steps.trial_scores.outcome == 'success'"
        run: |
          node stability-recovery/compound-lower-bound.mjs --self-test
          node stability-recovery/compound-lower-bound.mjs --repo . --metrics recovery-results/baseline-metrics.json --dumps recovery-results/baseline > recovery-results/compound-baseline.json
          node stability-recovery/compound-lower-bound.mjs --repo . --metrics recovery-results/trial-metrics.json --dumps recovery-results/trial > recovery-results/compound-trial.json
          node -e 'for (const stage of ["baseline", "trial"]) { const r = require("./recovery-results/compound-" + stage + ".json"); console.log(JSON.stringify({stage, fixtures:r.fixture_count, supported:r.supported_count, containment:r.containment_width_unavoidable_count, literal:r.literal_border_width_unavoidable_count, budget:r.allowed_quality_exceptions, exceeds:r.supported_subset_exceeds_exception_budget, contractViolations:r.observed_below_literal_contract.length, skipped:r.skip_counts})); }'
      - name: "Compare cell failure inventories"
        if: "!cancelled() && steps.trial.outcome == 'success'"
        run: "node stability-recovery/cell/summarize.mjs compare recovery-results/cell-baseline.jsonl.summary.json recovery-results/cell-trial.jsonl.summary.json"
      - name: "Check the unchanged official quality gate"
        if: "!cancelled() && steps.trial.outcome == 'success' && steps.comparisons.outcome == 'success'"
        run: "go run ./tools/quality -emd \"$RUNNER_TEMP/emd-trial\" -jobs 4 > recovery-results/official-quality.log 2>&1"
      - name: "Show official gate conclusions"
        if: "!cancelled() && steps.trial.outcome == 'success' && steps.comparisons.outcome == 'success'"
        run: "tail -n 8 recovery-results/official-quality.log"
      - name: "Preserve experiment binaries"
        if: "!cancelled() && steps.trial.outcome == 'success'"
        run: |
          mkdir -p recovery-results/bin
          cp "$RUNNER_TEMP/emd-baseline" "$RUNNER_TEMP/emd-trial" recovery-results/bin/
      - name: "Upload reproducible experiment evidence"
        if: "!cancelled()"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "stabilization-geometry"
          path: |
            recovery-results
            corpus/.cache/quality
          if-no-files-found: "error"
          retention-days: 14
          include-hidden-files: true

  refinement-proof:
    runs-on: "depot-ubuntu-24.04-8"
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Install the pinned Lean toolchain"
        run: |
          test "$(cat proofs/lean-toolchain)" = "leanprover/lean4:v4.35.0"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/lean.tar.zst" \
            "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: "Compile the unregistered refinement drafts"
        run: |
          cp stability-recovery/proofs/RefinementMeaning.lean.txt proofs/Elegant/Layered/RefinementMeaning.lean
          cp stability-recovery/proofs/Refinement.lean.txt proofs/Elegant/Layered/Refinement.lean
          cd proofs
          lake build Elegant.Layered.Refinement

  family-cells:
    runs-on: "depot-ubuntu-24.04-8"
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Set up Go"
        uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: "Install the Rust toolchain"
        run: "rustup toolchain install"
      - name: "Set up Node"
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "26.13.1"
      - name: "Apply paired family repairs"
        id: "apply"
        run: |
          node stability-recovery/experiment.mjs prepare
          node stability-recovery/apply-family.mjs
          mkdir -p tools/cell-repair-probe
          cp stability-recovery/cell/main.go.txt tools/cell-repair-probe/main.go
          gofmt -w tools/cell-repair-probe/main.go
      - name: "Run Go family and layered regressions"
        if: "!cancelled() && steps.apply.outcome == 'success'"
        run: "go test -count=1 ./internal/layout ./internal/layout/layered"
      - name: "Run Rust public cell regressions"
        if: "!cancelled() && steps.apply.outcome == 'success'"
        run: "cargo test --locked -p elegant-mermaid --all-features --test cell_masks"
      - name: "Run Rust family unit regressions"
        if: "!cancelled() && steps.apply.outcome == 'success'"
        run: |
          cargo test --locked -p elegant-mermaid --all-features --lib layout::agentflow::tests
          cargo test --locked -p elegant-mermaid --all-features --lib layout::state::paint::tests
      - name: "Build and run the real cell probe"
        id: "probe"
        if: "!cancelled() && steps.apply.outcome == 'success'"
        run: |
          go build -o "$RUNNER_TEMP/cell-family" ./tools/cell-repair-probe
          mapfile -t fixtures < recovery-results/cells.txt
          "$RUNNER_TEMP/cell-family" "${fixtures[@]}" > recovery-results/cell-family.jsonl
          node stability-recovery/cell/summarize.mjs recovery-results/cell-family.jsonl
      - name: "Verify the minimal endpoint-preserving detour"
        if: "!cancelled() && steps.probe.outcome == 'success'"
        run: |
          "$RUNNER_TEMP/cell-family" --patch stability-recovery/cell/bipartite-patch.json stability-recovery/cell/complete-bipartite.mmd > recovery-results/cell-detour.jsonl
          node stability-recovery/cell/summarize.mjs recovery-results/cell-detour.jsonl
          node -e 'const r = require("./recovery-results/cell-detour.jsonl.summary.json"); if (r.totals.errors || r.totals.dump_failures || r.totals.cell_failures) throw new Error("detour failed actual renderer validation");'
      - name: "Upload family repair evidence"
        if: "!cancelled()"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "stabilization-family"
          path: "recovery-results"
          if-no-files-found: "error"
          retention-days: 14

  readable-evidence:
    needs: ["geometry", "family-cells"]
    if: "!cancelled()"
    runs-on: "depot-ubuntu-24.04-8"
    timeout-minutes: 15
    permissions:
      actions: "read"
      contents: "write"
    steps:
      - name: "Checkout evidence publisher"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up Node"
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "26.13.1"
      - name: "Download immutable experiment evidence"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8
        with:
          name: "stabilization-geometry"
          path: "evidence"
      - name: "Download family repair evidence"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8
        with:
          name: "stabilization-family"
          path: "evidence/family"
      - name: "Preserve readable evidence without ref updates"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "node stability-recovery/publish-evidence.mjs evidence"
